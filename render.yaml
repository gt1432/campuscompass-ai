services:
  - type: web
    name: campuscompass-ai
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.8-flash"
      - key: MONGODB_URI
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: HOST
        value: "0.0.0.0"
